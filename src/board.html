<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>narabee</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="board.css">
</head>
<body>
<div id="bar">
  <span class="brand">narabee</span>
  <div id="layouts" role="radiogroup" aria-label="レイアウト"></div>
  <span class="spacer"></span>
  <span class="hint">境目はドラッグで動かせます。枠の見出しをダブルクリックすると、その枠だけを大きくします。この帯はしばらくすると隠れます。タブを右クリック →「narabee レイアウトバーを表示」でまた出せます。</span>
  <button type="button" id="bar-close" title="この帯を隠す (タブの右クリックでまた出せる)">×</button>
</div>
<div id="stage"></div>

<template id="pane-tpl">
  <section class="pane">
    <header>
      <span class="num"></span>
      <button type="button" data-act="back" title="戻る">←</button>
      <button type="button" data-act="forward" title="進む">→</button>
      <button type="button" data-act="reload" title="再読み込み">↻</button>
      <form class="go"><input class="url" type="text" spellcheck="false" autocomplete="off" placeholder="URL を入力して Enter"></form>
      <button type="button" data-act="zoomout" title="縮小">−</button>
      <button type="button" data-act="zoomreset" class="zoom" title="100% に戻す">100%</button>
      <button type="button" data-act="zoomin" title="拡大">+</button>
      <button type="button" data-act="max" title="この枠だけを大きくする / 戻す">⛶</button>
      <button type="button" data-act="popout" title="新しいタブで開く">↗</button>
      <button type="button" data-act="close" title="この枠を閉じる (空にする)">×</button>
    </header>
    <div class="view">
      <iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-presentation allow-orientation-lock allow-storage-access-by-user-activation allow-top-navigation allow-top-navigation-to-custom-protocols" allow="fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media; picture-in-picture; publickey-credentials-get *; publickey-credentials-create *" allowfullscreen></iframe>
      <div class="empty">上の欄に URL を入力してください。<br>普通のタブで右クリック →「このページを narabee の枠に送る」でも入れられます。</div>
    </div>
  </section>
</template>

<script src="state.js"></script>
<script src="layouts.js"></script>
<script src="board.js"></script>
</body>
</html>
